plugins {
    id 'com.android.application'
}

android {
    namespace "io.github.daredevil3x7.airlinetycoon"
    compileSdk 34
    // CI passes the NDK that is preinstalled on the runner
    ndkVersion System.getenv("AT_NDK_VERSION") ?: "27.2.12479018"

    defaultConfig {
        applicationId "io.github.daredevil3x7.airlinetycoon"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("AT_VERSION_CODE") ?: "1") as Integer)
        versionName System.getenv("AT_VERSION_NAME") ?: "dev"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    // Fan build for sideloading: one fixed, public key, so that every build installs as an
    // update of the previous one (and the imported game files and savegames stay).
    signingConfigs {
        fan {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fan
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fan
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // SDL's Java side has to match the native SDL that is compiled in jni/SDL
            java.srcDirs = ['src/main/java', 'jni/SDL/android-project/app/src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
